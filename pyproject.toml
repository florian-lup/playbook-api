[tool.poetry]
name = "playbook-server"
version = "0.1.0"
description = "FastAPI backend for Playbook"
authors = ["Flo <contact@florianlup.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
perplexityai = "^0.30"
pydantic-settings = "^2.7"
sse-starlette = "^2.2"
python-dotenv = "^1.1"
PyJWT = { version = "^2.10", extras = ["crypto"] }
slowapi = "^0.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
pytest = "^8.3"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
